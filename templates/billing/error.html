{% extends "base.html" %}
{% block title %}Billing Error &middot; PhishGuard{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-20 text-center">
    <div class="w-16 h-16 bg-panel2 rounded-full flex items-center justify-center mx-auto mb-6">
        <span class="material-symbols-outlined text-[32px] text-danger">error</span>
    </div>
    <h1 class="text-2xl font-bold text-text mb-2">Something went wrong</h1>
    <p class="text-subtext mb-8">{{ error | default("We couldn't process your billing request at this time.") }}</p>
    <a href="/pricing" class="inline-block px-6 py-2.5 bg-brand hover:opacity-90 text-white font-medium rounded-lg hover:bg-slate-800 transition-colors">
        Return to Pricing
    </a>
</div>
{% endblock %}
