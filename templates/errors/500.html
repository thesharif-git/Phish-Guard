<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>500 — Server Error · PhishGuard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --danger: #ef4444; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #09090b;
      color: #fafafa;
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 60% 40% at 50% 0%, rgba(239,68,68,.12) 0%, transparent 65%);
      pointer-events: none;
    }
    .container {
      text-align: center;
      max-width: 480px;
      padding: 40px 24px;
      position: relative;
      z-index: 1;
    }
    .error-code {
      font-size: clamp(80px, 15vw, 140px);
      font-weight: 900;
      letter-spacing: -.06em;
      line-height: 1;
      background: linear-gradient(135deg, #ef4444, #fca5a5);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }
    .icon {
      width: 64px; height: 64px;
      margin: 0 auto 24px;
      background: rgba(239,68,68,.1);
      border: 1px solid rgba(239,68,68,.2);
      border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      color: #f87171;
    }
    h1 { font-size: 22px; font-weight: 700; color: #fafafa; letter-spacing: -.03em; margin-bottom: 10px; }
    p { font-size: 14px; color: #71717a; line-height: 1.75; margin-bottom: 32px; }
    .btn-group { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; }
    .btn {
      display: inline-flex; align-items: center; gap: 7px;
      font-size: 14px; font-weight: 600;
      padding: 10px 22px; border-radius: 10px;
      text-decoration: none; transition: all .15s;
      letter-spacing: -.01em; font-family: inherit;
    }
    .btn-primary { background: #2563eb; color: #fff; border: 1px solid #2563eb; }
    .btn-primary:hover { background: #1e40af; transform: translateY(-1px); }
    .btn-secondary { background: transparent; color: #a1a1aa; border: 1px solid #27272a; }
    .btn-secondary:hover { background: #18181b; color: #fafafa; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
      </svg>
    </div>
    <div class="error-code">500</div>
    <h1>Something Went Wrong</h1>
    <p>
      An internal server error occurred. Our team has been notified.<br />
      Please try refreshing the page or come back shortly.
    </p>
    <div class="btn-group">
      <a href="/dashboard" class="btn btn-primary">← Return to Dashboard</a>
      <button onclick="location.reload()" class="btn btn-secondary">↻ Retry</button>
    </div>
  </div>
</body>
</html>
