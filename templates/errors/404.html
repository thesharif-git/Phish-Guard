<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found · PhishGuard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --brand: #2563eb; --brand-d: #1e40af; }
    body {
      font-family: 'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #09090b;
      color: #fafafa;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    /* Radial glow background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 40% at 50% 0%, rgba(37, 99, 235, .2) 0%, transparent 60%),
        radial-gradient(ellipse 40% 60% at 80% 80%, rgba(30, 64, 175, .1) 0%, transparent 50%);
      pointer-events: none;
    }
    .container {
      text-align: center;
      max-width: 480px;
      padding: 40px 24px;
      position: relative;
      z-index: 1;
    }
    .error-code {
      font-size: clamp(80px, 15vw, 140px);
      font-weight: 900;
      letter-spacing: -.06em;
      line-height: 1;
      background: linear-gradient(135deg, #2563eb, #93c5fd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }
    .shield-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 24px;
      background: rgba(37, 99, 235, .12);
      border: 1px solid rgba(37, 99, 235, .25);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #93c5fd;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #fafafa;
      letter-spacing: -.03em;
      margin-bottom: 10px;
    }
    p {
      font-size: 14px;
      color: #71717a;
      line-height: 1.75;
      margin-bottom: 32px;
    }
    .btn-group { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 14px;
      font-weight: 600;
      padding: 10px 22px;
      border-radius: 10px;
      text-decoration: none;
      transition: all .15s;
      letter-spacing: -.01em;
      font-family: inherit;
    }
    .btn-primary {
      background: var(--brand);
      color: #fff;
      border: 1px solid var(--brand);
      box-shadow: 0 2px 10px rgba(37, 99, 235, .3);
    }
    .btn-primary:hover { background: var(--brand-d); transform: translateY(-1px); box-shadow: 0 4px 18px rgba(37, 99, 235, .4); }
    .btn-secondary {
      background: transparent;
      color: #a1a1aa;
      border: 1px solid #27272a;
    }
    .btn-secondary:hover { background: #18181b; color: #fafafa; }
  </style>
</head>
<body>
  <div class="container">
    <div class="shield-icon" style="background: rgba(16, 185, 129, 0.12); border-color: rgba(16, 185, 129, 0.3);">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
        <path d="M12 3L4.5 6.5V12.2C4.5 16.9 7.7 21 12 22.2C16.3 21 19.5 16.9 19.5 12.2V6.5L12 3Z" stroke="#34d399" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" fill="#10B981" fill-opacity="0.2"/>
        <path d="M8.5 12.3L10.8 14.6L15.5 9.9" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="error-code">404</div>
    <h1>Page Not Found</h1>
    <p>
      The page you're looking for doesn't exist or may have been moved.<br />
      Let's get you back to safety.
    </p>
    <div class="btn-group">
      <a href="/dashboard" class="btn btn-primary">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>
        Go to Dashboard
      </a>
      <a href="javascript:history.back()" class="btn btn-secondary">← Go Back</a>
    </div>
  </div>
</body>
</html>
